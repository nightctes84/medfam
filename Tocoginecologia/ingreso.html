<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingreso - Protocolo T-15 CAPS XV</title>
    <!-- Supabase y Tailwind -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 h-screen flex items-center justify-center">

    <div class="bg-white p-8 rounded-lg shadow-md w-96">
        <h2 class="text-2xl font-bold text-center text-blue-600 mb-6">Protocolo T-15</h2>
        <p class="text-sm text-gray-600 text-center mb-6">Acceso exclusivo personal CAPS XV</p>
        
        <div class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700">Correo Electrónico</label>
                <input type="email" id="email" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">Contraseña</label>
                <input type="password" id="password" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500">
            </div>
            <button onclick="iniciarSesion()" class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700">
                Ingresar al Sistema
            </button>
            <p id="mensaje-error" class="text-red-500 text-sm mt-2 hidden">Credenciales incorrectas.</p>
        </div>
    </div>

<script>
        const supabaseUrl = 'https://cxnajcsedyrgjrxywfio.supabase.co'; 
        const supabaseKey = 'sb_publishable_UhDLg7iPmd2068IOdGgr6A_Y-YwonRE'; 
        
        // CORRECCIÓN: Le cambiamos el nombre a 'clienteSupabase'
        const clienteSupabase = supabase.createClient(supabaseUrl, supabaseKey);

        async function iniciarSesion() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            alert("Conectando con la base de datos...");

            // CORRECCIÓN: Usamos 'clienteSupabase' para validar
            const { data, error } = await clienteSupabase.auth.signInWithPassword({
                email: email,
                password: password,
            });

            if (error) {
                alert("Error detectado: " + error.message);
                const errorDiv = document.getElementById('mensaje-error');
                errorDiv.innerText = "Error: " + error.message;
                errorDiv.classList.remove('hidden');
            } else {
                alert("¡Acceso correcto! Redirigiendo al panel...");
                window.location.href = 't15.html';
            }
        }
    </script>
</body>
</html>
