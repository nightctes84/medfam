<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Gestión - Protocolo T-15</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex h-screen overflow-hidden">

    <!-- Menú Lateral -->
    <aside class="w-64 bg-gray-800 text-white flex flex-col">
        <div class="h-16 flex items-center justify-center border-b border-gray-700 font-bold text-lg">
            CAPS XV - T-15
        </div>
        <nav class="flex-1 px-4 py-4 space-y-2">
            <button onclick="mostrarSeccion('alertas')" class="w-full text-left px-4 py-2 rounded hover:bg-gray-700">🔔 Alertas Pendientes</button>
            <button onclick="mostrarSeccion('nuevo')" class="w-full text-left px-4 py-2 rounded hover:bg-gray-700">➕ Ingresar Paciente / Contacto</button>
            <button onclick="mostrarSeccion('listado')" class="w-full text-left px-4 py-2 rounded hover:bg-gray-700">📋 Listado y Seguimiento</button>
        </nav>
        <div class="p-4 border-t border-gray-700">
            <button onclick="cerrarSesion()" class="w-full bg-red-600 hover:bg-red-700 text-white py-2 rounded">Cerrar Sesión</button>
        </div>
    </aside>

    <!-- Área Principal -->
    <main class="flex-1 p-8 overflow-y-auto">
        
        <!-- Módulo: Alertas -->
        <section id="sec-alertas" class="seccion-app">
            <h1 class="text-2xl font-bold mb-4 border-b pb-2">Alertas de Adherencia Semanal</h1>
            <p class="text-gray-600 mb-4">Pacientes que deben concurrir hoy para la aplicación de dosis.</p>
            <div class="bg-white p-4 rounded shadow" id="contenedor-alertas">
                <p class="text-sm text-gray-500">No hay alertas pendientes por el momento.</p>
            </div>
        </section>

        <!-- Módulo: Nuevo Registro -->
        <section id="sec-nuevo" class="seccion-app hidden">
            <h1 class="text-2xl font-bold mb-4 border-b pb-2">Registrar Caso Índice o Contacto</h1>
            <div class="bg-white p-6 rounded shadow max-w-lg">
                <form id="formulario-paciente" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium">DNI</label>
                        <input type="text" id="dni_paciente" class="mt-1 w-full border rounded p-2">
                    </div>
                    <div>
                        <label class="block text-sm font-medium">Nombre Completo</label>
                        <input type="text" id="nombre_paciente" class="mt-1 w-full border rounded p-2" required>
                    </div>
                    <div>
                        <label class="block text-sm font-medium">Teléfono (Para citación)</label>
                        <input type="text" id="telefono_paciente" class="mt-1 w-full border rounded p-2">
                    </div>
                    <div>
                        <label class="block text-sm font-medium">Domicilio (Para visita domiciliaria)</label>
                        <input type="text" id="direccion_paciente" class="mt-1 w-full border rounded p-2">
                    </div>
                    <div>
                        <label class="block text-sm font-medium">Tipo de Caso</label>
                        <select id="tipo_caso" class="mt-1 w-full border rounded p-2">
                            <option value="Caso Índice">Caso Índice</option>
                            <option value="Contacto Sexual">Contacto Sexual</option>
                        </select>
                    </div>
                    <button type="button" onclick="guardarPaciente()" class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700">Guardar Registro</button>
                </form>
                <!-- Mensaje de éxito oculto -->
                <p id="mensaje-exito" class="text-green-600 font-bold mt-4 hidden">¡Paciente registrado con éxito!</p>
            </div>
        </section>

        <!-- Módulo: Listado -->
        <section id="sec-listado" class="seccion-app hidden">
            <h1 class="text-2xl font-bold mb-4 border-b pb-2">Pacientes en Seguimiento</h1>
            <div class="bg-white p-4 rounded shadow">
                <p class="text-sm text-gray-500">Aquí aparecerá la lista de pacientes.</p>
            </div>
        </section>
    </main>

    <script>
        const supabaseUrl = 'https://cxnajcsedyrgjrxywfio.supabase.co'; 
        const supabaseKey = 'sb_publishable_UhDLg7iPmd2068IOdGgr6A_Y-YwonRE'; 
        
        const clienteSupabase = supabase.createClient(supabaseUrl, supabaseKey);

        // Verifica que nadie entre sin loguearse
        async function verificarSesion() {
            const { data: { session } } = await clienteSupabase.auth.getSession();
            if (!session) {
                window.location.href = 'ingreso.html';
            }
        }
        verificarSesion();

        // Controla el menú lateral
        function mostrarSeccion(id) {
            const secciones = document.querySelectorAll('.seccion-app');
            secciones.forEach(sec => sec.classList.add('hidden'));
            document.getElementById('sec-' + id).classList.remove('hidden');
        }

        // Cierra sesión
        async function cerrarSesion() {
            await clienteSupabase.auth.signOut();
            window.location.href = 'ingreso.html';
        }

        // Guarda el paciente en la base de datos
        async function guardarPaciente() {
            const dni = document.getElementById('dni_paciente').value;
            const nombre = document.getElementById('nombre_paciente').value;
            const telefono = document.getElementById('telefono_paciente').value;
            const direccion = document.getElementById('direccion_paciente').value;
            const tipo = document.getElementById('tipo_caso').value;

            if (nombre.trim() === '') {
                alert("Por favor, ingresa el nombre del paciente.");
                return;
            }

            const { data, error } = await clienteSupabase
                .from('pacientes')
                .insert([
                    { 
                        dni: dni, 
                        nombre_completo: nombre, 
                        telefono: telefono, 
                        direccion: direccion, 
                        tipo_caso: tipo 
                    }
                ]);

            if (error) {
                alert("Hubo un error al guardar: " + error.message);
            } else {
                document.getElementById('mensaje-exito').classList.remove('hidden');
                document.getElementById('formulario-paciente').reset();
                setTimeout(() => {
                    document.getElementById('mensaje-exito').classList.add('hidden');
                }, 3000);
            }
        }
    </script>
</body>
</html>
